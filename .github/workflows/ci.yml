name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,plots]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src/kalshi_alpha

      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

      - name: Validate estimators against ground truth
        # The recovery checks are the substantive gate: they fail if an
        # estimator stops finding the answer the simulator was built around.
        run: python -m kalshi_alpha.cli validate

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plots]"

      - name: Run the full pipeline
        run: python -m kalshi_alpha.cli demo --out artifacts

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: research-report
          path: artifacts/
          retention-days: 30
