[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-alpha"
version = "0.1.0"
description = "Mispricing detection, no-arbitrage enforcement, and information-diffusion measurement for Kalshi event contracts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kshitiz Singh" }]
keywords = [
    "prediction-markets", "event-contracts", "kalshi", "arbitrage",
    "market-microstructure", "price-discovery", "quantitative-finance",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pydantic>=2.0",
    "httpx>=0.24",
    "cryptography>=41.0",
    "websockets>=11.0",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.80",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
kalshi-alpha = "kalshi_alpha.cli:main"

[project.urls]
Homepage = "https://github.com/K611-dot/kalshi-alpha"
Issues = "https://github.com/K611-dot/kalshi-alpha/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: long-running statistical tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
# N818: SequenceGap / BookCorruption / RiskViolation read better without
# an "Error" suffix; they name the condition, not the class hierarchy.
ignore = ["E501", "B008", "N803", "N806", "N818", "RET504"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []

[tool.coverage.run]
source = ["src/kalshi_alpha"]
branch = true
